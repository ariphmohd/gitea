name: 🚀 Gitea App DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave blank for commit SHA)'
        required: false
        default: ''

permissions:
  id-token: write   # Required for requesting AWS OIDC STS JWT Token
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gitea-custom
  GITOPS_REPO: ariphmohd/gitea-platform
  ROLE_TO_ASSUME: arn:aws:iam::542697646590:role/gitea-prod-github-actions-ecr-role

jobs:
  # ============================================================================
  # 1. Security Vulnerability Scan Job (Trivy CVE Scanner)
  # ============================================================================
  security-scan:
    name: 🛡️ Trivy Vulnerability & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking on advisory CVEs

  # ============================================================================
  # 2. Build, Sign & Push Container Image to Amazon ECR (Passwordless OIDC)
  # ============================================================================
  build-and-push:
    name: 📦 Build & Push to Amazon ECR (AWS OIDC)
    needs: [security-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Explicit job-level OIDC permission
      contents: read
    steps:
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Authenticate with AWS via OpenID Connect (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::542697646590:role/gitea-prod-github-actions-ecr-role
          aws-region: ap-south-1

      - name: 🔑 Log in to Amazon ECR Private Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
