name: 🔐 Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Step 1: Get and inspect GitHub OIDC token
      # ------------------------------------------------------------
      - name: 🔎 Get OIDC Token
        shell: bash
        run: |
          set -e

          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to obtain OIDC token"
            exit 1
          fi

          echo "✅ OIDC token received successfully"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Fix base64 padding
          PAYLOAD="${PAYLOAD}$(printf '%*s' \
            $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "🔎 OIDC Claims:"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            repository_id,
            repository_owner_id,
            ref,
            event_name
          }'

      # ------------------------------------------------------------
      # Step 2: Assume the NEW AWS IAM role
      # ------------------------------------------------------------
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::542697646590:role/ariph-new-github-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # ------------------------------------------------------------
      # Step 3: Verify AWS identity
      # ------------------------------------------------------------
      - name: ✅ Verify AWS Identity
        run: |
          aws sts get-caller-identity
