name: 🚀 Gitea App CI/CD Pipeline (AWS OIDC & ECR)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave blank for commit SHA)'
        required: false
        default: ''

# Mandatory permissions for requesting AWS OIDC STS JWT tokens
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gitea-custom
  AWS_ROLE_ARN: arn:aws:iam::542697646590:role/gitea-prod-github-actions-ecr-role
  GITOPS_REPO: ariphmohd/gitea-platform

jobs:
  build-and-push:
    name: 🛡️ Build, Scan & Push to Amazon ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout Application Source Code
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Trivy Vulnerability & Security Scanner
      - name: 🛡️ Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Step 3: Setup Docker Buildx Engine
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Authenticate to AWS via Passwordless OpenID Connect (OIDC)
      - name: 🔐 Authenticate to AWS via OIDC (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 5: Log in to Amazon ECR Private Registry
      - name: 📦 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Compute Image Tag & URLs
      - name: 🏷️ Compute Image Tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${TAG}" >> "$GITHUB_OUTPUT"

      # Step 7: Build & Push Rootless Container Image to Amazon ECR
      - name: 🚀 Build & Push Rootless Container Image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rootless
          push: true
          tags: |
            ${{ steps.meta.outputs.FULL_IMAGE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 8: Checkout GitOps Platform Repository (Using Native Action)
      - name: 🐙 Checkout GitOps Platform Repository
        uses: actions/checkout@v4
        with:
          repository: ariphmohd/gitea-platform
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo
          persist-credentials: true

      # Step 9: Update Manifests & Commit to Platform Repo (ArgoCD Auto-Sync)
      - name: 🚀 Update GitOps Image Tag & Push
        env:
          NEW_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "================================================================="
          echo "🚀 UPDATING GITOPS PLATFORM REPOSITORY FOR ARGOCD AUTO-DEPLOY"
          echo "================================================================="
          echo "New Image Tag: ${NEW_TAG}"

          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update helm/gitea-values.yaml
          if [ -f "helm/gitea-values.yaml" ]; then
            python3 -c "
            import re
            with open('helm/gitea-values.yaml', 'r') as f:
                content = f.read()
            content = re.sub(r'(repository:\s*).*', r'\g<1>${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}', content)
            content = re.sub(r'(tag:\s*).*', r'\g<1>\"${NEW_TAG}\"', content)
            with open('helm/gitea-values.yaml', 'w') as f:
                f.write(content)
            "
            echo "✅ Updated helm/gitea-values.yaml"
          fi

          # Update argocd/values/gitea-values.yaml
          if [ -f "argocd/values/gitea-values.yaml" ]; then
            python3 -c "
            import re
            with open('argocd/values/gitea-values.yaml', 'r') as f:
                content = f.read()
            content = re.sub(r'(repository:\s*).*', r'\g<1>${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}', content)
            content = re.sub(r'(tag:\s*).*', r'\g<1>\"${NEW_TAG}\"', content)
            with open('argocd/values/gitea-values.yaml', 'w') as f:
                f.write(content)
            "
            echo "✅ Updated argocd/values/gitea-values.yaml"
          fi

          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): auto-deploy custom gitea image tag ${NEW_TAG} [skip ci]"
            git push origin main || git push origin master
            echo "================================================================="
            echo "🎉 GITOPS HANDSHAKE COMPLETE!"
            echo "Successfully pushed new image tag (${NEW_TAG}) to ${{ env.GITOPS_REPO }}!"
            echo "ArgoCD on EKS will now trigger a zero-downtime rolling update."
            echo "================================================================="
          else
            echo "ℹ️ Manifests already up to date with tag ${NEW_TAG}."
          fi
