name: 🚀 Gitea App DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave blank for commit SHA)'
        required: false
        default: ''

permissions:
  id-token: write   # Required for requesting AWS OIDC STS JWT Token
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gitea-custom
  GITOPS_REPO: ariphmohd/gitea-platform
  ROLE_TO_ASSUME: arn:aws:iam::542697646590:role/gitea-prod-github-actions-ecr-role

jobs:
  # ============================================================================
  # 1. Security Vulnerability Scan Job (Trivy CVE Scanner)
  # ============================================================================
  security-scan:
    name: 🛡️ Trivy Vulnerability & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking on advisory CVEs

  # ============================================================================
  # 2. Build, Sign & Push Container Image to Amazon ECR (Passwordless OIDC)
  # ============================================================================
  build-and-push:
    name: 📦 Build & Push to Amazon ECR (AWS OIDC)
    needs: [security-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Explicit job-level OIDC permission
      contents: read
    steps:
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Authenticate with AWS via OpenID Connect (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::542697646590:role/gitea-prod-github-actions-ecr-role
          aws-region: ap-south-1

      - name: 🔑 Log in to Amazon ECR Private Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Compute Image Tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build and Push Rootless Container Image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rootless
          push: true
          tags: |
            ${{ steps.meta.outputs.FULL_IMAGE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Automated GitOps Tag Promotion to ArgoCD Platform Repository
  # ============================================================================
  update-gitops:
    name: 🐙 Update GitOps Manifests (ArgoCD Auto-Sync)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🏷️ Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 📥 Clone GitOps Repository (gitea-platform)
        if: ${{ env.GITOPS_PAT != '' || secrets.GITOPS_PAT != '' }}
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${{ env.GITOPS_REPO }}.git gitops-repo

      - name: ✏️ Update Image Tag in Helm & ArgoCD Values
        if: ${{ env.GITOPS_PAT != '' || secrets.GITOPS_PAT != '' }}
        env:
          NEW_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          cd gitops-repo
          
          # Update helm/gitea-values.yaml if present
          if [ -f "helm/gitea-values.yaml" ]; then
            sed -i "s|repository:.*|repository: 542697646590.dkr.ecr.ap-south-1.amazonaws.com/gitea-custom|g" helm/gitea-values.yaml
            sed -i "s|tag: \".*\"|tag: \"${NEW_TAG}\"|g" helm/gitea-values.yaml
          fi

          # Update argocd/values/gitea-values.yaml if present
          if [ -f "argocd/values/gitea-values.yaml" ]; then
            sed -i "s|repository:.*|repository: 542697646590.dkr.ecr.ap-south-1.amazonaws.com/gitea-custom|g" argocd/values/gitea-values.yaml
            sed -i "s|tag: \".*\"|tag: \"${NEW_TAG}\"|g" argocd/values/gitea-values.yaml
          fi

          # Update argocd/gitea-application.yaml if present
          if [ -f "argocd/gitea-application.yaml" ]; then
            sed -i "s|targetRevision:.*|targetRevision: '10.5.0'|g" argocd/gitea-application.yaml
          fi

          # Commit & Push changes to trigger ArgoCD rolling update
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): auto-deploy custom gitea image tag ${NEW_TAG} [skip ci]"
            git push origin main || git push origin master
            echo "✅ Successfully updated GitOps repository with image tag: ${NEW_TAG}"
          else
            echo "ℹ️ No changes detected in GitOps repository."
          fi

      - name: ℹ️ GitOps Secret Notice
        if: ${{ env.GITOPS_PAT == '' && secrets.GITOPS_PAT == '' }}
        run: |
          echo "⚠️ Note: Secret 'GITOPS_PAT' was not found in this repository."
          echo "Image ${{ steps.tag.outputs.TAG }} was pushed to Amazon ECR."
          echo "To enable automated GitOps promotion to ArgoCD, add 'GITOPS_PAT' in GitHub Settings -> Secrets -> Actions."
