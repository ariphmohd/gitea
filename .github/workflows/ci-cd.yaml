name: Build, scan and publish Gitea image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gitea-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-scan-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate repository variables
        shell: bash
        run: |
          for VARIABLE in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN ECR_REPOSITORY
          do
            if [[ -z "${!VARIABLE}" ]]; then
              echo "::error::Missing repository variable: ${VARIABLE}"
              exit 1
            fi
          done

      - name: Check out application source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch official version tags
        run: |
          git fetch --no-tags https://github.com/go-gitea/gitea.git \
            'refs/tags/*:refs/tags/*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.rootless
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: gitea-ci-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push the scanned image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          LOCAL_IMAGE="${ECR_REPOSITORY}:${IMAGE_TAG}"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "$LOCAL_IMAGE" "$ECR_IMAGE"
          docker push "$ECR_IMAGE"

          echo "Published image: \`${ECR_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
