name: 🚀 Gitea App CI/CD Pipeline (AWS OIDC & ECR)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave blank for commit SHA)'
        required: false
        default: ''

# Mandatory permissions for requesting AWS OIDC STS JWT tokens
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gitea-custom
  AWS_ROLE_ARN: arn:aws:iam::542697646590:role/gitea-prod-github-actions-ecr-role
  GITOPS_REPO: ariphmohd/gitea-platform

jobs:
  build-and-push:
    name: 🛡️ Build, Scan & Push to Amazon ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout Application Source Code
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Trivy Vulnerability & Security Scanner
      - name: 🛡️ Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Step 3: Setup Docker Buildx Engine
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Authenticate to AWS via Passwordless OpenID Connect (OIDC)
      - name: 🔐 Authenticate to AWS via OIDC (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 5: Log in to Amazon ECR Private Registry
      - name: 📦 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Compute Image Tag & URLs
      - name: 🏷️ Compute Image Tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${TAG}" >> "$GITHUB_OUTPUT"

      # Step 7: Build & Push Rootless Container Image to Amazon ECR
      - name: 🚀 Build & Push Rootless Container Image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rootless
          push: true
          tags: |
            ${{ steps.meta.outputs.FULL_IMAGE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 8: Automated GitOps Promotion to Platform Repository (ArgoCD Auto-Sync)
      - name: 🐙 Promote Image Tag to GitOps Platform Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          NEW_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FULL_IMAGE: ${{ steps.meta.outputs.FULL_IMAGE }}
        run: |
          if [ -z "${GITOPS_PAT}" ]; then
            echo "================================================================="
            echo "✅ IMAGE BUILD & ECR PUSH COMPLETED SUCCESSFULLY!"
            echo "Pushed Image: ${FULL_IMAGE}"
            echo "ℹ️ Note: 'GITOPS_PAT' secret was not found."
            echo "To enable automatic ArgoCD rolling deployments, add 'GITOPS_PAT'"
            echo "in GitHub Secrets (repo: ariphmohd/gitea)."
            echo "================================================================="
            exit 0
          fi

          echo "================================================================="
          echo "🚀 UPDATING GITOPS PLATFORM REPOSITORY FOR ARGOCD AUTO-DEPLOY"
          echo "================================================================="
          echo "New Image Tag: ${NEW_TAG}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/${{ env.GITOPS_REPO }}.git" /tmp/gitops-repo
          cd /tmp/gitops-repo

          # Update helm/gitea-values.yaml
          if [ -f "helm/gitea-values.yaml" ]; then
            sed -i "s|repository:.*|repository: ${REGISTRY}/${{ env.ECR_REPOSITORY }}|g" helm/gitea-values.yaml
            sed -i "s|tag: \".*\"|tag: \"${NEW_TAG}\"|g" helm/gitea-values.yaml
          fi

          # Update argocd/values/gitea-values.yaml
          if [ -f "argocd/values/gitea-values.yaml" ]; then
            sed -i "s|repository:.*|repository: ${REGISTRY}/${{ env.ECR_REPOSITORY }}|g" argocd/values/gitea-values.yaml
            sed -i "s|tag: \".*\"|tag: \"${NEW_TAG}\"|g" argocd/values/gitea-values.yaml
          fi

          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(gitops): auto-deploy custom gitea image tag ${NEW_TAG} [skip ci]"
            git push origin main || git push origin master
            echo "✅ Successfully updated GitOps repository with image tag: ${NEW_TAG}"
          else
            echo "ℹ️ No changes detected in GitOps repository."
          fi
