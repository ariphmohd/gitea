name: 🚀 Gitea App DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-scan-and-deploy:
    name: 🛡️ Build, Security Scan & GitOps Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Application Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TEMPORARY: helps identify the exact OIDC claims
      - name: 🔎 Debug GitHub OIDC
        uses: github/actions-oidc-debugger@main
        continue-on-error: true

      - name: 🔐 Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ap-south-1

      - name: ✅ Verify AWS Identity
        run: aws sts get-caller-identity
